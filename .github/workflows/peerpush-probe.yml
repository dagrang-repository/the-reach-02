# Reach 02 - PeerPush probe. Manual only (workflow_dispatch), read-only: loads PeerPush's pages from a GitHub runner
# and reports, as annotations, whether a plain headless browser reaches the email sign-in form or meets a bot check.
# Never types, submits or creates anything. Needs no secrets. Replaced by the real PeerPush job once the answer is in.
name: PeerPush probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peerpush
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser (outside the repo, so package-lock stays untouched)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/tools/peerpush-probe.mjs" .
      - name: Probe PeerPush
        working-directory: ${{ runner.temp }}/pw
        run: node peerpush-probe.mjs
